<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigate B1+ · Uy vazifasi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{color-scheme:light;--bg:#f4f6fb;--card:#fff;--ink:#1f2433;--mute:#5f6679;--line:#e3e6ef;--acc:#2f6fdb;--ok:#14864f;--okbg:#e7f7ee;--bad:#c93c3c;--badbg:#fdecec;--soft:#e8f0fd}
*{box-sizing:border-box;min-width:0}
body{margin:0;font:16px/1.5 Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:clip}
button,input{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #8fb1ff;outline-offset:2px}
header{background:var(--acc);color:#fff;padding:26px 16px 22px}
.wrap{max-width:760px;margin:0 auto}
header h1{margin:0;font-size:clamp(24px,4vw,30px);font-weight:800;line-height:1.2}
header h1 small{font-size:.7em;font-weight:600;opacity:.95}
header p{margin:6px 0 0;opacity:.95}
.topbtns{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.22);border:0;color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px;min-height:40px}
main{max-width:760px;margin:0 auto;padding:18px 14px 40px}
.card{background:var(--card);border-radius:16px;padding:20px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.card h3{margin:0 0 2px;font-size:18px}
.hint{color:var(--mute);font-style:italic;font-size:14px;margin:0 0 12px}
label.lbl{font-weight:800;display:block;margin-bottom:8px}
.txt{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;background:#fff;min-height:46px}
.txt:focus{border-color:var(--acc);outline:none}
.txt.ok{border-color:var(--ok);background:var(--okbg)}.txt.bad{border-color:var(--bad);background:var(--badbg)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--c,var(--acc));transition:width .3s}
.small{font-size:14px;color:var(--mute)}
.unit{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:16px;padding:18px 18px 16px 22px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,30,60,.06);border-left:7px solid var(--c)}
.unit:hover{transform:translateY(-2px)}
.unit .tag{color:var(--c);font-weight:800;font-size:13px}
.unit h2{margin:6px 0 4px;font-size:21px}.unit h2 span{font-weight:400;color:var(--mute);font-size:17px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 4px;font-weight:800;font-size:14px;min-height:44px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.w{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;text-align:center;min-height:64px}
.w b{display:block;font-size:17px}.w span{display:block;color:var(--mute);font-size:13.5px;line-height:1.3;margin-top:3px}
.stage{font-weight:800;color:var(--acc);font-size:13px;margin:12px 0 8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.match>div{display:flex;flex-direction:column;gap:8px}
.mb{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;min-height:46px}
.mb.sel{border-color:var(--acc);background:var(--soft)}
.mb.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);pointer-events:none}
.mb.bad,.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.q{border-top:1px solid var(--line);padding:12px 0 6px}.q:first-of-type{border-top:0}
.qt{margin-bottom:8px}.qt .n{color:var(--acc);font-weight:800;margin-right:6px}
.opts{display:flex;flex-direction:column;gap:8px}.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;text-align:left;min-height:44px}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.opt.pick{border-color:var(--acc);background:var(--soft)}
.in{display:flex;gap:8px;align-items:stretch}.in .txt{flex:1}
.btn{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;white-space:nowrap;min-height:46px}
.btn.ghost{background:#fff;color:var(--acc);border:2px solid var(--line)}
.fb{font-size:14px;margin-top:5px;min-height:0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.rule{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:10px}
.tray{display:flex;flex-wrap:wrap;gap:7px;min-height:50px;border:2px dashed var(--line);border-radius:12px;padding:7px;margin-bottom:8px}
.tray.ok{border-color:var(--ok);background:var(--okbg)}.tray.bad{border-color:var(--bad);background:var(--badbg)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;min-height:40px}
.chip.used{visibility:hidden}
.done{display:inline-block;margin-left:6px;font-size:12.5px;font-weight:800;color:var(--ok);background:var(--okbg);border-radius:9px;padding:1px 8px;vertical-align:2px}
.next{display:block;width:100%;margin-top:6px;padding:14px;font-size:16px}
.score{font-weight:800;font-size:19px;margin-top:10px}
footer{text-align:center;color:var(--mute);font-size:13.5px;padding:10px 14px 40px}
footer b{color:var(--ink)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,520px);background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9}
@media(max-width:560px){header h1{font-size:23px}.tab{font-size:12.5px}.in{flex-wrap:wrap}.in .txt{flex-basis:100%}.in .btn{flex:1}.bank{grid-template-columns:repeat(2,minmax(0,1fr))}.mb{font-size:14px;padding:8px 6px}}
</style>
</head>

{n:3,title:"Life skills",uz:"Hayotiy ko‘nikmalar",topics:"Challenges & success · Work skills · Compound adjectives · Ability · Obligation, permission & possibility",

{n:4,title:"Space",uz:"Makon",topics:"Living on water · The natural world · Idiomatic phrases about places · will/be going to · Probability",
vocab:[["houseboat","qayiq-uy"],["floating","suzib turuvchi"],["flood","toshqin; suv bosmoq"],["sea level","dengiz sathi"],["inhabitant","aholi, yashovchi"],["citizen","fuqaro"],["community","jamoa, mahalla"],["rock","tosh, qoya"],["valley","vodiy"],["waterfall","sharshara"],["stream","soy, jilg‘a"],["cliff","jarlik, qoya"],["forest","o‘rmon"],["coast","sohil"],["cave","g‘or"],["field","dala"],["feel at home","o‘zini uydagidek his qilmoq"],["in the middle of nowhere","odamsiz joyda, olis joyda"],["packed like sardines","tiqilinch, bir-biriga yopishib"],["know like the back of my hand","besh qo‘ldek bilmoq"],["a fish out of water","o‘zini begona his qilmoq"],["off the beaten track","odam kam boradigan joyda"],["suburbs","shahar chekkasi"],["crowded","gavjum"]],

{
const COL=["#2f6fdb","#6b46c1","#0f8a6a","#c2570c","#c0266d","#0e7490","#b91c1c","#4d7c0f","#7c3aed","#0369a1","#be123c","#a16207"];
const TASKS=["v1","v2","v3","v4","g0f","g0c","g1f","g1c","b","t"],PER=TASKS.length;
const TABS=[["lugat","Lug‘at"],["grammatika","Grammatika"],["gap","Gap tuzish"],["test","Test ✓"]];
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
let S={name:"",done:{},score:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("navb1plus")||"{}"))}catch(e){}

const cnt=u=>TASKS.filter(t=>S.done[u+t]).length,total=()=>UNITS.reduce((a,_,i)=>a+cnt(i),0);
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuf=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?]+$/,"").replace(/\s+/g," ").trim();
const okAns=(v,a)=>a.split("|").some(x=>norm(x)===norm(v));

/* ovoz */
let VO=null,keep=null,AU=null;
const pickV=()=>{try{const vs=speechSynthesis.getVoices();VO=vs.find(v=>/^en[-_]GB/i.test(v.lang))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}};
if("speechSynthesis" in window){pickV();try{speechSynthesis.addEventListener("voiceschanged",pickV)}catch(e){speechSynthesis.onvoiceschanged=pickV}}
const toast=t=>{const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{el.hidden=true},7000)};
const NOV="Ovoz chiqmadi. Telefon jim rejimda emasligini va media ovozi baland ekanini tekshiring. Telegram ichida ochilgan bo‘lsa, Chrome’da oching.";
const tts=t=>{try{const s=speechSynthesis;if(s.speaking||s.pending)s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.9;if(!VO)pickV();if(VO){u.voice=VO;u.lang=VO.lang}u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled")toast(NOV)};keep=u;s.speak(u)}catch(e){toast(NOV)}};
const hasEn=()=>{try{return "speechSynthesis" in window&&speechSynthesis.getVoices().some(v=>/^en/i.test(v.lang))}catch(e){return false}};
const gAudio=t=>{try{if(AU)AU.pause();AU=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q="+encodeURIComponent(t));AU.onerror=()=>toast(NOV);const p=AU.play();if(p&&p.catch)p.catch(()=>toast(NOV))}catch(e){toast(NOV)}};
const say=t=>{if(hasEn())tts(t);else gAudio(t)};

 let h=`<div class="tabs">`+TABS.map(t=>`<button class="tab${t[0]===tab?" on":""}" data-go="u${u+1}-${t[0]}">${t[1]}</button>`).join("")+`</div>`;
 const V=X.vocab;
 if(tab==="lugat"){
  h+=`<div class="card"><h3>So‘zlar banki</h3><div class="hint">So‘zni bosing — talaffuzini eshitasiz.</div><div class="bank">${V.map(w=>`<button class="w" data-say="${esc(w[0])}"><b>${esc(w[0])}</b><span>${esc(w[1])}</span></button>`).join("")}</div></div>`;
  h+=box(u,"v1","So‘z va ma’nosini juftlang","Chapdan inglizcha so‘zni, o‘ngdan uning ma’nosini bosing.")+matchHTML(shuf(V,r),r,"v1")+`</div>`;
  h+=box(u,"v2","O‘zbekchaga mos so‘z","To‘g‘ri inglizcha so‘zni tanlang.")+shuf(V,r).slice(0,6).map((w,i)=>chooseQ(i,w[1],w[0],shuf([w[0],...shuf(V.filter(x=>x[0]!==w[0]),r).slice(0,2).map(x=>x[0])],r))).join("")+`</div>`;
  h+=box(u,"v3","So‘zni yozing","O‘zbekcha ma’nosiga qarab inglizcha yozing. Qiynalsangiz «Yordam»ni bosing.")+shuf(V,r).slice(0,5).map((w,i)=>inp(i,esc(w[1]),w[0])).join("")+`</div>`;
  h+=box(u,"v4","Gapni to‘ldiring","Bo‘sh joyga mos so‘z yoki iborani yozing (lug‘atdan).")+X.vgap.map((g,i)=>inp(i,esc(g[0]),g[1])).join("")+`</div>`;
  h+=`<button class="btn next" data-go="u${u+1}-grammatika">Keyingisi: Grammatika →</button>`;
 }
 if(tab==="grammatika"){
  X.grammar.forEach((g,k)=>{
   h+=`<div class="card"><h3>${esc(g.name)}</h3><div class="rule">${g.note}</div></div>`;
   h+=box(u,"g"+k+"f",esc(g.name)+" — shaklini yozing","Qavsdagi fe’lni to‘g‘ri shaklda yoki bo‘sh joyga mos so‘zni yozing.")+g.form.map((f,i)=>inp(i,esc(f[0]),f[1])).join("")+`</div>`;
   h+=box(u,"g"+k+"c",esc(g.name)+" — to‘g‘ri gapni tanlang","O‘zbekcha gapning to‘g‘ri tarjimasini toping.")+g.choose.map((c,i)=>chooseQ(i,c[0],c[1][0],shuf(c[1],r))).join("")+`</div>`;
  });
  h+=`<button class="btn next" data-go="u${u+1}-gap">Keyingisi: Gap tuzish →</button>`;
 }
 if(tab==="gap"){
  h+=box(u,"b","Gap tuzing","So‘zlarni to‘g‘ri tartibda bosing. Xato bossangiz, yuqoridagi so‘zni bosib qaytaring.")+X.build.map((b,i)=>{const ws=b[0].split(" ");return `<div class="q bq" data-ans="${esc(b[0])}"><div class="qt"><span class="n">${i+1}</span>${esc(b[1])}</div><div class="tray"></div><div class="chips">${shuf(ws.map((w,j)=>[w,j]),r).map(p=>`<button class="chip" data-j="${p[1]}">${esc(p[0])}</button>`).join("")}</div><div class="in"><button class="btn bk">Tekshirish</button><button class="btn ghost br">Qaytadan</button><button class="btn ghost bs" data-say="${esc(b[0])}">▶ Eshitish</button></div><div class="fb"></div></div>`}).join("")+`</div>`;
  h+=`<button class="btn next" data-go="u${u+1}-test">Keyingisi: Test →</button>`;
 }
 if(tab==="test"){
  const qs=[];
  shuf(V,r).slice(0,4).forEach(w=>qs.push([`«${w[1]}» inglizcha qanday?`,w[0],shuf(V.filter(x=>x[0]!==w[0]),r).slice(0,3).map(x=>x[0])]));
  shuf(V,r).slice(0,2).forEach(w=>qs.push([`«${w[0]}» so‘zining ma’nosi?`,w[1],shuf(V.filter(x=>x[0]!==w[0]),r).slice(0,3).map(x=>x[1])]));
  X.grammar.forEach(g=>shuf(g.choose,r).slice(0,2).forEach(c=>qs.push([c[0],c[1][0],c[1].slice(1)])));
  h+=box(u,"t","Yakuniy test",`${qs.length} ta savol. Javoblarni belgilang va «Natijani ko‘rish»ni bosing. 70% va undan yuqori — topshiriq bajariladi.`)+qs.map((q,i)=>`<div class="q tq" data-ans="${esc(q[1])}"><div class="qt"><span class="n">${i+1}</span>${esc(q[0])}</div><div class="opts">${shuf([q[1],...q[2]],r).map(o=>`<button class="opt" data-t="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`).join("")+`<button class="btn" id="fin">Natijani ko‘rish</button><div class="score" id="res">${S.score[u]!=null?"Oldingi natija: "+S.score[u]+" / "+qs.length:""}</div></div>`;
  h+=u<11?`<button class="btn next" data-go="u${u+2}-lugat">Keyingi unit: ${esc(UNITS[u+1].title)} →</button>`:`<button class="btn next" data-go="">Tabriklaymiz! Barcha unitlarga qaytish</button>`;
 }
 $("app").innerHTML=h;
 $("app").querySelectorAll(".match").forEach(m=>bindMatch(m,u));
}
function bindMatch(m,u){let sel=null;
 m.addEventListener("click",e=>{const b=e.target.closest(".mb");if(!b)return;
  if(b.dataset.side==="l"){m.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));sel=b;b.classList.add("sel");say(b.dataset.k);return}
  if(!sel){b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),500);return}
  if(b.dataset.k===sel.dataset.k){b.classList.add("ok");sel.classList.add("ok");sel.classList.remove("sel");sel=null;const c=m.closest(".card");if(![...c.querySelectorAll(".mb")].some(x=>!x.classList.contains("ok")))mark(u,m.dataset.t)}
  else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),500)}});
}
function checkCard(c,u){if([...c.querySelectorAll(".q")].every(q=>q.dataset.solved))mark(u,c.id.slice(2))}
$("app").addEventListener("click",e=>{
 const u=cur.u,s=e.target.closest("[data-say]");if(s){say(s.dataset.say);return}
 const o=e.target.closest(".opt[data-o]");
 if(o){const q=o.closest(".q");if(q.dataset.solved)return;if(o.dataset.o===q.dataset.ans){o.classList.add("ok");q.dataset.solved=1;checkCard(q.closest(".card"),u)}else o.classList.add("bad");return}
 const tq=e.target.closest(".opt[data-t]");
 if(tq){const q=tq.closest(".q");if(q.dataset.locked)return;q.querySelectorAll(".opt").forEach(x=>x.classList.remove("pick"));tq.classList.add("pick");q.dataset.pick=tq.dataset.t;return}
 if(e.target.id==="fin"){const qs=[...document.querySelectorAll(".tq")];let ok=0;
  qs.forEach(q=>{q.dataset.locked=1;q.querySelectorAll(".opt").forEach(x=>{x.classList.remove("pick");if(x.dataset.t===q.dataset.ans)x.classList.add("ok");else if(x.dataset.t===q.dataset.pick)x.classList.add("bad")});if(q.dataset.pick===q.dataset.ans)ok++});
  S.score[u]=ok;save();const p=ok/qs.length;
  $("res").textContent=(S.name?S.name+", natijangiz: ":"Natija: ")+ok+" / "+qs.length+(p>=.7?" — Barakalla!":" — Qoidalarni takrorlab, yana urinib ko‘ring.");
  if(p>=.7)mark(u,"t");e.target.textContent="Qaytadan ishlash";e.target.id="again";return}
 if(e.target.id==="again"){unit(u,"test");return}
 const ch=e.target.closest(".chip");
 if(ch){const q=ch.closest(".bq");if(q.dataset.solved)return;const tray=q.querySelector(".tray");
  if(ch.parentElement===tray){const src=q.querySelector(`.chips .chip[data-j="${ch.dataset.j}"]`);if(src)src.classList.remove("used");ch.remove()}
  else{ch.classList.add("used");const c=document.createElement("button");c.className="chip";c.dataset.j=ch.dataset.j;c.textContent=ch.textContent;tray.appendChild(c)}
  tray.classList.remove("bad");return}
 const bk=e.target.closest(".bk,.br");
 if(bk){const q=bk.closest(".bq"),tray=q.querySelector(".tray"),f=q.querySelector(".fb");if(q.dataset.solved)return;
  if(bk.classList.contains("br")){tray.innerHTML="";q.querySelectorAll(".chips .chip").forEach(x=>x.classList.remove("used"));tray.className="tray";f.textContent="";return}
  const got=[...tray.children].map(x=>x.textContent).join(" ");
  if(norm(got)===norm(q.dataset.ans)){tray.className="tray ok";f.className="fb ok";f.textContent="To‘g‘ri! ✓";q.dataset.solved=1;checkCard(q.closest(".card"),u)}
  else{tray.className="tray bad";f.className="fb bad";f.textContent=tray.children.length?"Tartib noto‘g‘ri, yana urinib ko‘ring.":"So‘zlarni bosib gap tuzing."}
  return}
 const ck=e.target.closest(".ck,.hp");
 if(ck){const q=ck.closest(".q"),i=q.querySelector("input"),f=q.querySelector(".fb"),a=q.dataset.ans;if(q.dataset.solved)return;
  if(ck.classList.contains("hp")){i.value=a.split("|")[0];f.className="fb";f.textContent="To‘g‘ri javob ko‘rsatildi — endi «Tekshirish»ni bosing.";return}
  if(okAns(i.value,a)){i.className="txt ok";f.className="fb ok";f.textContent="To‘g‘ri! ✓";q.dataset.solved=1;i.disabled=true;checkCard(q.closest(".card"),u)}
  else{i.className="txt bad";f.className="fb bad";f.textContent=i.value.trim()?"Noto‘g‘ri, yana urinib ko‘ring.":"Javobni yozing."}}
});
$("app").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches(".q .txt"))e.target.closest(".q").querySelector(".ck").click()});
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){location.hash=g.dataset.go;if(!g.dataset.go)route();return}const b=e.target.closest(".unit");if(b)location.hash="u"+(+b.dataset.u+1)+"-lugat"});
const cur={u:0};
function route(){const m=/^#u([1-9]|1[0-2])-(lugat|grammatika|gap|test)$/.exec(location.hash);
 if(m){cur.u=+m[1]-1;unit(cur.u,m[2])}else{document.body.style.removeProperty("--c");home()}window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
}
</script>
</body>
</html>
